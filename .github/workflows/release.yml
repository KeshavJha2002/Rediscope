name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Run Test Suite & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm install

      - name: Build Binary
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Verify Package Dry-Run
        run: npm pack --dry-run

  publish-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Package npm Tarball
        run: npm pack

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          node -e '
            const fs = require("fs");
            const ref = process.env.GITHUB_REF_NAME || "";
            const ver = ref.replace(/^v/, "") || "1.0.0";
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const targetHeader = "## [" + ver + "]";
            let extracting = false;
            const lines = [];
            for (const line of changelog.split("\n")) {
              if (line.startsWith("## [")) {
                if (line.includes(targetHeader)) {
                  extracting = true;
                  continue;
                } else if (extracting) {
                  break;
                }
              }
              if (extracting) {
                lines.push(line);
              }
            }
            const notes = lines.join("\n").trim() || ("Release " + ref);
            fs.writeFileSync("RELEASE_NOTES.md", notes + "\n");
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rediscope ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            *.tgz
            prebuilds/darwin-arm64/rediscope
            prebuilds/darwin-x64/rediscope
            prebuilds/linux-arm64/rediscope
            prebuilds/linux-x64/rediscope
            prebuilds/win32-x64/rediscope.exe
          draft: false
          prerelease: false
          generate_release_notes: true
